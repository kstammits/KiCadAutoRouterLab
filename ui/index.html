<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KiCad AutoRouter — Workflow</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background:#101418; color:#d7e0e9; margin:0; padding:0; height:100vh; display:flex; flex-direction:column; }
  h1 { font-size:1.1rem; margin:0; padding:.5rem 1rem; background:#161c22; border-bottom:1px solid #2a3540; }
  
  /* Main layout */
  .app-layout { display:flex; flex:1; overflow:hidden; }
  
  /* Left sidebar - footprint list */
  .sidebar { width:380px; min-width:320px; max-width:500px; background:#161c22; border-right:1px solid #2a3540; display:flex; flex-direction:column; overflow:hidden; }
  .sidebar-header { padding:.5rem .75rem; border-bottom:1px solid #2a3540; display:flex; gap:.5rem; align-items:center; font-size:.75rem; color:#9fb0c0; }
  .sidebar-title { font-weight:600; color:#d7e0e9; font-size:.8rem; }
  .sidebar-search { flex:1; background:#101418; border:1px solid #3a4a5a; color:#d7e0e9; border-radius:4px; padding:.2rem .5rem; font-family:inherit; font-size:.75rem; }
  .sidebar-search:focus { outline:none; border-color:#7ee0a0; }
  .sidebar-filters { padding:.5rem .75rem; border-bottom:1px solid #2a3540; display:flex; flex-direction:column; gap:.35rem; font-size:.7rem; color:#9fb0c0; }
  .filter-row { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
  .filter-label { min-width:55px; opacity:.7; }
  .filter-input { flex:1; min-width:80px; background:#101418; border:1px solid #3a4a5a; color:#d7e0e9; border-radius:3px; padding:.15rem .4rem; font-family:inherit; font-size:.7rem; }
  .filter-input:focus { outline:none; border-color:#7ee0a0; }
  .filter-select { background:#101418; border:1px solid #3a4a5a; color:#d7e0e9; border-radius:3px; padding:.15rem .4rem; font-family:inherit; font-size:.7rem; }
  .filter-chk { display:flex; gap:.25rem; align-items:center; font-size:.7rem; }
  
  .sidebar-content { flex:1; overflow:auto; }
  .fp-table { width:100%; border-collapse:collapse; font-size:.7rem; }
  .fp-table th { position:sticky; top:0; background:#161c22; color:#7d8b99; font-weight:600; text-align:left; padding:.3rem .5rem; border-bottom:1px solid #2a3540; z-index:1; white-space:nowrap; }
  .fp-table td { padding:.25rem .5rem; border-bottom:1px solid #1a2028; vertical-align:middle; }
  .fp-table tr:hover td { background:#1a222a; }
  .fp-table tr.fp-selected-row td { background:#1a2e1a; }
  .fp-table tr.fp-locked-row td { opacity:.6; }
  .fp-table tr.fp-pinned-row td { opacity:.8; }
  .fp-table tr.fp-ghost-row td { opacity:.5; background:#2a1a2a; }
  .fp-col-select { width:28px; text-align:center; }
  .fp-col-ref { font-family:monospace; font-weight:500; color:#d7e0e9; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fp-col-footprint { color:#9fb0c0; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fp-col-layer { text-transform:uppercase; font-size:.65rem; padding:.05rem .3rem; border-radius:3px; display:inline-block; }
  .fp-col-layer.F { background:#3d4a56; color:#9fb0c0; }
  .fp-col-layer.B { background:#4a3d3d; color:#e0a458; }
  .fp-col-nets { color:#7d8b99; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.65rem; }
  .fp-col-state { text-align:center; }
  .state-badge { font-size:.55rem; padding:.05rem .35rem; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }
  .state-locked { background:#3d1a1a; color:#e06c75; border:1px solid #5a2a2a; }
  .state-pinned { background:#3d2a1a; color:#e0a458; border:1px solid #5a4a2a; }
  .state-selected { background:#1a3d1a; color:#7ee0a0; border:1px solid #2a5a2a; }
  .state-movable { background:#1a2a1a; color:#5aaa5a; border:1px solid #2a4a2a; }
  .state-fixed { background:#2a2a2a; color:#5b6b7a; border:1px solid #3a3a3a; }
  .state-ghost { background:#3d1a3d; color:#a85cf5; border:1px solid #5a2a5a; }
  
  .sidebar-footer { padding:.5rem .75rem; border-top:1px solid #2a3540; display:flex; gap:.4rem; flex-wrap:wrap; }
  .sidebar-footer button { flex:1; min-width:0; padding:.3rem .5rem; font-size:.65rem; }
  
  /* Resizer */
  .resizer { width:4px; background:#2a3540; cursor:col-resize; flex-shrink:0; }
  .resizer:hover, .resizer.dragging { background:#7ee0a0; }
  .resizer-h { height:4px; cursor:row-resize; }
  .resizer-h:hover, .resizer-h.dragging { background:#7ee0a0; }
  
  [hidden] { display: none !important; }

  /* Main content area */
  .main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  .top-bar { background:#161c22; border-bottom:1px solid #2a3540; padding:.5rem .75rem; display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; font-size:.8rem; color:#7d8b99; }
  .top-bar h1 { background:none; border:none; padding:0; font-size:.95rem; color:#d7e0e9; margin:0; }
  
  .pipeline { display:flex; flex-direction:column; gap:.5rem; padding:.5rem; max-height:120px; overflow:auto; }
  .pipeline.collapsed { max-height: 0; padding: 0; overflow: hidden; }
  .pipeline-toggle { font-size:.6rem; padding:.1rem .4rem; margin-bottom:.25rem; }
  .stage { border:1px solid #2a3540; border-radius:6px; padding:.6rem .8rem; background:#161c22; }
  .stage h2 { font-size:.8rem; margin:0 0 .2rem; display:flex; gap:.4rem; align-items:center; }
  .num { color:#5b6b7a; font-size:.7rem; }
  p { margin:0; color:#9fb0c0; font-size:.75rem; }
  .chip { margin-left:auto; font-size:.6rem; padding:.1rem .4rem; border-radius:999px; border:1px solid #3a4a5a; color:#8fa2b5; text-transform:uppercase; letter-spacing:.05em; }
  .chip.implemented { color:#7ee0a0; border-color:#2e6b45; }
  
  .board { border:1px solid #2a3540; border-radius:8px; background:#0b0e12; overflow:hidden; flex:1; display:flex; flex-direction:column; min-height:0; }
  .board .bar { display:flex; gap:.5rem; align-items:center; padding:.4rem .7rem; border-bottom:1px solid #2a3540; font-size:.7rem; color:#7d8b99; flex-wrap:wrap; }
  .board-viewport { position:relative; flex:1; background:#0b0e12; overflow:hidden; min-height:0; }
  .board-viewport svg { display:block; width:100%; height:100%; }
  .board-viewport.panning { cursor:grabbing; }
  .board-viewport.selecting { cursor:crosshair; }
  .zoom-info { font-size:.65rem; color:#7d8b99; font-variant-numeric:tabular-nums; }

  /* Bottom panel for Place/Route controls */
  .bottom-panel { border-top:1px solid #2a3540; background:#161c22; height:300px; max-height:70vh; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
  .bottom-panel.collapsed { height: 32px; }
  .panel-tabs { display:flex; gap:.25rem; align-items:center; padding:.3rem .5rem; border-bottom:1px solid #2a3540; background:#1a1f25; }
  .panel-toggle { margin-left:auto; font-size:.6rem; padding:.1rem .4rem; background:#1a222a; border-color:#3a4a5a; color:#9fb0c0; }
  .panel-toggle:hover:not(:disabled) { border-color:#7ee0a0; color:#d7e0e9; }
  .panel-content { flex:1; overflow:auto; padding:.5rem; }
  .panel-content > div[hidden] { display: none; }
  .panel-content > div:not([hidden]) { display: block; }

  /* Drop zone inside board viewport */
  .board-viewport .drop { position:absolute; inset:0; margin:0; border:2px dashed #3a4a5a; border-radius:8px; background:rgba(16,20,24,0.95); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; transition: border-color 0.2s, background 0.2s; }
  .board-viewport .drop:hover, .board-viewport .drop.drag-over { border-color: #7ee0a0; background:rgba(16,20,24,0.98); }
  .board-viewport .drop p { margin-top:.5rem; }
  .board-viewport .drop code { background:#161c22; padding:.1rem .4rem; border-radius:3px; border:1px solid #3a4a5a; }
  button { background:#1f2833; border:1px solid #3a4a5a; color:#d7e0e9; border-radius:5px; padding:.25rem .6rem; cursor:pointer; font-family:inherit; font-size:.7rem; }
  button:hover:not(:disabled) { border-color:#7ee0a0; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#1a3a1a; border-color:#2e6b45; color:#7ee0a0; }
  button.primary:hover:not(:disabled) { background:#225522; }
  
  /* Loading spinner on button */
  button.loading {
    position: relative;
    color: transparent !important;
    pointer-events: none;
  }
  button.loading::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    opacity: 0.8;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .tab-btn { background:#1a222a; border-color:#3a4a5a; color:#9fb0c0; padding:.2rem .5rem; font-size:.65rem; }
  .tab-btn:hover:not(:disabled) { border-color:#7ee0a0; color:#d7e0e9; }
  .tab-btn.active { background:#1a3a1a; border-color:#2e6b45; color:#7ee0a0; }
  .chk { display:flex; gap:.3rem; align-items:center; font-size:.7rem; color:#9fb0c0; }
  #diag { margin-left:auto; color:#7d8b99; font-size:.65rem; min-width:200px; }
  
  .params { display:grid; grid-template-columns:1fr 1fr; gap:.4rem .8rem; padding:.6rem .7rem; font-size:.7rem; }
  .param { display:flex; flex-direction:column; gap:.2rem; color:#9fb0c0; }
  .param .row { display:flex; gap:.4rem; align-items:center; }
  .param input[type=range] { flex:1; min-width:0; }
  .param input[type=number] { width:5rem; background:#161c22; border:1px solid #3a4a5a; color:#d7e0e9; border-radius:3px; padding:.1rem .25rem; font-family:inherit; font-size:.7rem; }
  
  /* Selection toolbar */
  .sel-toolbar { display:flex; gap:.4rem; align-items:center; padding:.35rem .7rem; border-top:1px solid #2a3540; font-size:.65rem; color:#9fb0c0; flex-wrap:wrap; background:#161c22; }
  .sel-toolbar button { padding:.15rem .45rem; font-size:.6rem; }
  .sel-count { margin-left:auto; font-variant-numeric:tabular-nums; }
  
  /* Net legend */
  .net-legend { display:flex; gap:.4rem; flex-wrap:wrap; align-content:flex-start; max-height:120px; overflow-y:auto; padding:.35rem .7rem; border-top:1px solid #2a3540; font-size:.6rem; color:#9fb0c0; background:#161c22; align-items:center; }
  .net-legend.collapsed { max-height: 0; padding: 0; border-top: none; overflow: hidden; }
  .net-legend-header { display:flex; gap:.4rem; align-items:center; padding:.35rem .7rem; border-top:1px solid #2a3540; font-size:.6rem; color:#9fb0c0; background:#161c22; }
  .net-legend-toggle { background:#1a222a; border:1px solid #3a4a5a; color:#9fb0c0; padding:.1rem .4rem; font-size:.6rem; border-radius:3px; cursor:pointer; }
  .net-legend-toggle:hover { border-color:#7ee0a0; color:#d7e0e9; }
  .net-legend-item { display:flex; align-items:center; gap:.2rem; padding:.1rem .4rem; border-radius:3px; cursor:pointer; border:1px solid transparent; white-space:nowrap; }
  .net-legend-item:hover { background:#1a222a; border-color:#3a4a5a; }
  .net-legend-swatch { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
  .net-legend-name { max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .net-legend-count { color:#5b6b7a; font-variant-numeric:tabular-nums; }
  
  /* Parameter description table */
  .param-desc-table { width:100%; border-collapse:collapse; font-size:.65rem; color:#9fb0c0; margin-top:.4rem; }
  .param-desc-table th, .param-desc-table td { padding:.25rem .4rem; border:1px solid #2a3540; text-align:left; }
  .param-desc-table th { background:#161c22; color:#d7e0e9; font-weight:600; }
  .param-desc-table code { background:#0b0e12; padding:.05rem .25rem; border-radius:3px; font-size:.6rem; }
  .param-desc-table tr:nth-child(even) td { background:#161c22; }
  
  /* Footprint states in SVG */
  .footprint.fp-locked line { stroke: #e06c75; stroke-dasharray: 2 2; }
  .footprint.fp-pinned line { stroke: #e0a458; stroke-dasharray: 4 2; }
  .footprint.fp-selected line { stroke: #7ee0a0; stroke-width: 0.2; }
  .footprint.fp-movable line { stroke: #4a8a4a; stroke-width: 0.15; opacity: 0.6; }
  .footprint.fp-locked text { fill: #e06c75; }
  .footprint.fp-pinned text { fill: #e0a458; }
  .footprint.fp-selected text { fill: #7ee0a0; }
  .footprint.fp-movable text { fill: #4a8a4a; }
  
  /* Marquee selection rectangle */
  .marquee { position:absolute; pointer-events:none; border:1px dashed #7ee0a0; background:rgba(126,224,160,0.1); z-index:10; }
  
  .drop { margin:1rem; border:1px dashed #3a4a5a; border-radius:8px; padding:2rem; text-align:center; color:#7d8b99; font-size:.8rem; }
  .file { color:#d7e0e9; }
</style>
</head>
<body>
<header>
  <h1>KiCad AutoRouter — Workflow</h1>
</header>

<div class="app-layout">
  <!-- Left Sidebar: Footprint List -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Footprints</span>
      <input type="search" class="sidebar-search" id="fp-search" placeholder="Filter by ref, footprint, net..." aria-label="Filter footprints">
    </div>
    <div class="sidebar-filters">
      <div class="filter-row">
        <span class="filter-label">Ref:</span>
        <input type="text" class="filter-input" id="filter-ref" placeholder="R*, C1, U*" aria-label="Filter by reference pattern">
        <span class="filter-label">Net:</span>
        <input type="text" class="filter-input" id="filter-net" placeholder="GND, VCC, NET_*" aria-label="Filter by net name">
      </div>
      <div class="filter-row">
        <span class="filter-label">Layer:</span>
        <select class="filter-select" id="filter-layer" aria-label="Filter by layer">
          <option value="">All</option>
          <option value="F">Front (F.Cu)</option>
          <option value="B">Back (B.Cu)</option>
        </select>
        <span class="filter-label">State:</span>
        <select class="filter-select" id="filter-state" aria-label="Filter by state">
          <option value="">All</option>
          <option value="movable">Movable</option>
          <option value="locked">Locked (KiCad)</option>
          <option value="pinned">Pinned (User)</option>
          <option value="selected">Selected</option>
          <option value="ghost">Ghost</option>
        </select>
      </div>
      <div class="filter-row">
        <label class="filter-chk"><input type="checkbox" id="filter-hide-locked" checked> Hide locked</label>
        <label class="filter-chk"><input type="checkbox" id="filter-hide-fixed"> Hide fixed (locked+pinned)</label>
      </div>
    </div>
    <div class="sidebar-content">
      <table class="fp-table" id="fp-table">
        <thead>
          <tr>
            <th class="fp-col-select"><input type="checkbox" id="fp-select-all" title="Select all visible"></th>
            <th class="fp-col-ref">Ref</th>
            <th class="fp-col-footprint">Footprint</th>
            <th class="fp-col-layer">Layer</th>
            <th class="fp-col-nets">Nets</th>
            <th class="fp-col-state">State</th>
          </tr>
        </thead>
        <tbody id="fp-tbody"></tbody>
      </table>
    </div>
    <div class="sidebar-footer">
      <button id="sidebar-select-visible" title="Select all visible (filtered)">Select Visible</button>
      <button id="sidebar-clear-sel" title="Clear selection">Clear</button>
      <button id="sidebar-pin-sel" title="Pin selected">Pin</button>
      <button id="sidebar-unpin-sel" title="Unpin selected">Unpin</button>
    </div>
  </aside>
  <div class="resizer" id="resizer" aria-label="Resize sidebar"></div>
  
  <!-- Main Content -->
  <main class="main-content">
    <div class="top-bar">
      <input type="file" id="load-input" accept=".kicad_pcb,.kicad_sch" multiple hidden>
      <button id="load-btn">Load PCB…</button>
      <span id="board-name" style="flex:1; text-align:center;">no board loaded</span>
      <span id="board-sch" class="chip" hidden>pcb only</span>
      <label class="chk"><input type="checkbox" id="overlay-toggle" checked> proposal</label>
      <label class="chk"><input type="checkbox" id="forces-toggle"> forces</label>
      <label class="chk"><input type="checkbox" id="drc-toggle"> DRC</label>
      <label class="chk"><input type="checkbox" id="layer-fcu" checked> F.Cu</label>
      <label class="chk"><input type="checkbox" id="layer-bcu" checked> B.Cu</label>
      <span class="zoom-info" id="zoom-info">100%</span>
      <button id="fit-btn" title="Fit board to view">Fit</button>
      <button id="download-btn" title="Download modified PCB" hidden>Download</button>
      <button id="undo-btn" title="Undo last accept" disabled>Undo</button>
      <button id="reset-btn" title="Reset to original board" hidden>Reset</button>
      <button id="pipeline-toggle-btn" class="pipeline-toggle" title="Toggle pipeline">Pipeline ▼</button>
    </div>
    
    <div class="pipeline" id="pipeline"></div>
    
    <!-- Board viewport - takes remaining space -->
    <div class="board" id="board">
      <div class="board-viewport" id="board-viewport">
        <!-- Drop zone shown when no board loaded -->
        <div class="drop" id="drop-zone" hidden>
          Drop <code>.kicad_pcb</code> / <code>.kicad_sch</code> files here to load them.
          <p style="margin-top:.5rem;font-size:.75rem;color:#5b6b7a;">Or click <button id="load-btn-drop" style="background:none;border:1px solid #3a4a5a;padding:.15rem .5rem;border-radius:4px;cursor:pointer;">Load…</button></p>
        </div>
        <!-- SVG injected here -->
      </div>
      <div class="sel-toolbar" id="sel-toolbar" hidden>
        <button id="select-all-btn" title="Select all unlocked">Select All Unlocked</button>
        <button id="clear-sel-btn" title="Clear selection">Clear</button>
        <button id="pin-btn" title="Pin selected (prevent movement)">Pin</button>
        <button id="unpin-btn" title="Unpin selected">Unpin</button>
        <span class="sel-count" id="sel-count">0 selected, 0 pinned</span>
      </div>
      <div class="net-legend-header" id="net-legend-header">
        <span style="margin-right:.5rem; opacity:.6;">Nets:</span>
        <button id="net-legend-toggle" class="net-legend-toggle" title="Toggle net legend">▼</button>
      </div>
      <div class="net-legend" id="net-legend" hidden>
        <div id="net-legend-items"></div>
      </div>
</div>
    
    <!-- Vertical resizer between board and bottom panel -->
    <div class="resizer resizer-h" id="panel-resizer" aria-label="Resize bottom panel"></div>
    
    <!-- Bottom panel for Place/Route controls (collapsible) -->
    <div class="bottom-panel" id="bottom-panel">
      <div class="panel-tabs">
        <button id="place-tab-btn" class="tab-btn active" title="Placement panel">Place</button>
        <button id="route-tab-btn" class="tab-btn" title="Routing panel">Route</button>
        <button id="bottom-panel-toggle" class="panel-toggle" title="Collapse panel">▲</button>
      </div>
      <div class="panel-content" id="panel-content">
        <!-- Placement panel -->
        <div id="placement-panel">
          <div class="bar">
            <span class="num">Place</span>
            <label class="chk" style="margin-left:.5rem;"><input type="number" id="step-iters" value="50" min="1" max="5000" step="10" style="width:5rem;"> iters</label>
            <label class="chk" style="margin-left:.5rem;"><input type="checkbox" id="physics-mode" checked> Physics</label>
            <button id="step-selected-btn" class="primary" title="Run placement on selected footprints only">Step Selected</button>
            <button id="step-all-btn" title="Run placement on all movable footprints">Step All Movable</button>
            <button id="preview-btn" title="Quick preview of where selected would move">Preview</button>
            <button id="refresh-forces-btn" title="Recompute forces with current parameters">↻ Forces</button>
            <button id="accept-btn" disabled>Accept</button>
            <button id="clear-btn">Clear</button>
            <span id="diag"></span>
          </div>
          <div class="params" id="params-grid"></div>
          <div class="bar"><button id="reset-params-btn">Reset params</button></div>
        </div>

        <!-- Routing panel -->
        <div id="routing-panel" hidden>
          <div class="bar">
            <span class="num">Route</span>
            <button id="route-selected-btn" class="primary" title="Route selected nets">Route Selected Nets</button>
            <button id="route-all-btn" title="Route all unprotected nets">Route All Unprotected</button>
            <span id="route-diag"></span>
          </div>
          <div class="params" id="routing-params-grid"></div>
          <div class="nets-table-container">
            <table id="nets-table">
              <thead>
                <tr>
                  <th style="width:3rem;"><input type="checkbox" id="nets-select-all" title="Select all visible"></th>
                  <th>Net Name</th>
                  <th style="width:4rem;">Pads</th>
                  <th style="width:5rem;">Footprints</th>
                  <th style="width:5rem;">Tracks</th>
                  <th style="width:4rem;">Vias</th>
                  <th class="net-col-protect" style="width:4rem;" title="Protected nets are routed first and never ripped up">
                    <label class="chk"><input type="checkbox" id="nets-protect-all" title="Protect all visible">🔒</label>
                  </th>
                </tr>
              </thead>
              <tbody id="nets-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const pipeline = document.getElementById("pipeline");

async function loadStages() {
  const res = await fetch("/api/stages");
  const stages = await res.json();
  pipeline.innerHTML = "";
  for (const [i, s] of stages.entries()) {
    const el = document.createElement("div");
    el.className = "stage";
    el.innerHTML = `<h2><span class="num">${String(i + 1).padStart(2, "0")}</span>${s.name}<span class="chip ${s.status}">${s.status}</span></h2><p>${s.description}</p>`;
    pipeline.appendChild(el);
  }
}

// Pipeline collapse/expand
const pipelineToggleBtn = document.getElementById("pipeline-toggle-btn");
let pipelineCollapsed = false;

async function uploadFile(f) {
  const kind = f.name.endsWith(".kicad_sch") ? "sch" : "pcb";
  const res = await fetch(
    `/api/load?name=${encodeURIComponent(f.name)}&kind=${kind}`,
    { method: "POST", body: f }
  );
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// Auto-pair PCB/SCH files: group by stem, load PCB first then SCH
async function uploadFiles(files) {
  const fileArray = [...files];
  // Group by stem (filename without extension)
  const byStem = new Map();
  for (const f of fileArray) {
    const stem = f.name.replace(/\.(kicad_pcb|kicad_sch)$/i, "");
    if (!byStem.has(stem)) byStem.set(stem, { pcb: null, sch: null });
    const entry = byStem.get(stem);
    if (f.name.endsWith(".kicad_pcb")) entry.pcb = f;
    else if (f.name.endsWith(".kicad_sch")) entry.sch = f;
  }
  
  // Upload: PCB first, then SCH for each pair
  for (const [stem, { pcb, sch }] of byStem) {
    if (pcb) await uploadFile(pcb);
    if (sch) await uploadFile(sch);
  }
  // Any unpaired files (shouldn't happen with current grouping, but just in case)
  const unpaired = fileArray.filter(f => {
    const stem = f.name.replace(/\.(kicad_pcb|kicad_sch)$/i, "");
    const entry = byStem.get(stem);
    return !entry || (!entry.pcb && !entry.sch);
  });
  for (const f of unpaired) await uploadFile(f);
}

function logToValue(logVal, def) {
  return Math.pow(10, logVal);
}

function valueToLog(val, def) {
  return Math.log10(val);
}

paramsGrid.addEventListener("input", e => {
  const key = e.target.dataset.key;
  const def = PARAM_DEFS.find(d => d.key === key);
  const isLog = def?.log === true;
  const range = paramsGrid.querySelector(`input[type=range][data-key=${key}]`);
  const num = paramsGrid.querySelector(`input[type=number][data-key=${key}]`);
  const checkbox = paramsGrid.querySelector(`input[type=checkbox][data-key=${key}]`);
  
  if (checkbox) {
    // Boolean parameter
    return; // checkbox handled separately in readParams
  }
  
  if (e.target.type === "range") {
    if (isLog) {
      num.value = logToValue(Number(range.value), def).toFixed(def.step >= 1 ? 0 : 4);
    } else {
      num.value = range.value;
    }
  } else if (e.target.type === "number") {
    if (isLog) {
      range.value = valueToLog(Number(num.value), def).toFixed(2);
    } else {
      range.value = num.value;
    }
  }
  // Auto-refresh forces if currently shown
  if (forcesToggle.checked && lastVersion) {
    refreshForces();
  }
});

function readParams() {
  const out = {};
  for (const def of PARAM_DEFS) {
    const num = paramsGrid.querySelector(`input[type=number][data-key=${def.key}]`);
    if (num) out[def.key] = Number(num.value);
  }
  // Stub checkbox
  const stubCb = paramsGrid.querySelector(`input[type=checkbox][data-key=stub]`);
  if (stubCb) out["stub"] = stubCb.checked;
  return out;
}

async function loadParams(defaultsOnly = false) {
  const res = await fetch(`/api/placement/params${defaultsOnly ? "?defaults=1" : ""}`);
  if (!res.ok) throw new Error(await res.text());
  const p = await res.json();
  for (const def of PARAM_DEFS) {
    if (!(def.key in p)) continue;
    const range = paramsGrid.querySelector(`input[type=range][data-key=${def.key}]`);
    const num = paramsGrid.querySelector(`input[type=number][data-key=${def.key}]`);
    if (range && def.log) {
      range.value = valueToLog(p[def.key], def).toFixed(2);
    } else if (range) {
      range.value = p[def.key];
    }
    if (num) num.value = p[def.key];
  }
  // Stub checkbox
  const stubCb = paramsGrid.querySelector(`input[type=checkbox][data-key=stub]`);
  if (stubCb && "stub" in p) stubCb.checked = p.stub;
}

function boardSrc(version) {
  const overlayOn = overlayToggle?.checked ?? false;
  const forcesOn = forcesToggle?.checked ?? false;
  const drcOn = drcToggle?.checked ?? false;
  return `/api/board.svg?v=${version}&overlay=${overlayOn ? 1 : 0}&forces=${forcesOn ? 1 : 0}&drc=${drcOn ? 1 : 0}`;
}

function updateZoomInfo() {
  if (!viewBox) { zoomInfo.textContent = "100%"; return; }
  // viewBox width relative to initial width (100% = initial fit)
  const pct = Math.round((1 / viewBox[2]) * viewport.clientWidth * 100);
  zoomInfo.textContent = `${pct}%`;
}

function applyViewBox() {
  const svg = viewport.querySelector("svg");
  if (!svg || !viewBox) return;
  svg.setAttribute("viewBox", viewBox.join(" "));
  updateZoomInfo();
}

function fitToView() {
  const svg = viewport.querySelector("svg");
  if (!svg) return;
  // Read the original viewBox from the SVG
  const vbAttr = svg.getAttribute("viewBox");
  if (!vbAttr) return;
  const vb = vbAttr.split(" ").map(Number);
  if (vb.length === 4) {
    viewBox = [...vb];
    applyViewBox();
  }
}

let costGridDebug = null;
let costGridOverlay = false;

function showCostGridDebug(debug) {

      costGridOverlay = e.target.checked;

function renderCostGridOverlay() {
  if (!costGridDebug || !costGridOverlay) {
    // Remove existing overlay
    const existing = viewport.querySelector(".cost-grid-overlay");
    if (existing) existing.remove();
    return;
  }
  
  // Remove existing overlay
  const existing = viewport.querySelector(".cost-grid-overlay");
  if (existing) existing.remove();
  
  const svg = viewport.querySelector("svg");
  if (!svg) return;
  
  // Get SVG viewBox for coordinate mapping
  const vbAttr = svg.getAttribute("viewBox");
  if (!vbAttr) return;
  const [vbx, vby, vbw, vbh] = vbAttr.split(" ").map(Number);
  
  // Use F.Cu layer data for PNG overlay
  const fcuLayer = costGridDebug.layers.find(l => l.layer === "F.Cu");
  if (!fcuLayer) return;
  
  // Create image element for PNG overlay
  const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
  img.classList.add("cost-grid-overlay");
  img.style.pointerEvents = "none";
  img.style.opacity = "0.5";
  
  // Map cost grid bounds to board coordinates
  const originX = costGridDebug.origin_mm[0];
  const originY = costGridDebug.origin_mm[1];
  const resolutionMm = costGridDebug.resolution_mm;
  const scale = fcuLayer.scale;
  const gridWidthMm = fcuLayer.width * scale * resolutionMm;
  const gridHeightMm = fcuLayer.height * scale * resolutionMm;
  
  // Position in board mm coordinates
  const xMm = originX;
  const yMm = originY + gridHeightMm; // Bottom of grid in board coords
  
  // Map to SVG coordinates (viewport units)
  const xPx = ((xMm - vbx) / vbw) * viewport.clientWidth;
  const yPx = ((vby + vbh - yMm) / vbh) * viewport.clientHeight;
  const widthPx = (gridWidthMm / vbw) * viewport.clientWidth;
  const heightPx = (gridHeightMm / vbh) * viewport.clientHeight;
  
  img.setAttribute("x", xPx);
  img.setAttribute("y", yPx - heightPx);
  img.setAttribute("width", widthPx);
  img.setAttribute("height", heightPx);
  img.setAttribute("href", ""); // Will be set by fetch
  img.setAttribute("preserveAspectRatio", "none");
  
  // Fetch PNG and set it
  fetch("/api/routing/debug/cost-grid.png")
    .then(res => {
      if (!res.ok) throw new Error("PNG fetch failed");
      return res.json();
    })
    .then(data => {
      if (data.png) {
        img.setAttribute("href", data.png);
        svg.appendChild(img);
      }
    })
    .catch(err => {
      console.error("Cost grid PNG fetch failed:", err);
    });
}

async function fetchAndInjectSVG(version) {
  const res = await fetch(boardSrc(version));
  if (!res.ok) return;
  const svgText = await res.text();
  viewport.querySelectorAll("svg").forEach(el => el.remove());
  const tpl = document.createElement("template");
  tpl.innerHTML = svgText;
  for (const node of tpl.content.childNodes) viewport.appendChild(node);
  // Capture initial viewBox for zoom reference ONLY on first load
  const svg = viewport.querySelector("svg");
  if (svg && viewBox === null) {
    const vbAttr = svg.getAttribute("viewBox");
    if (vbAttr) {
      const vb = vbAttr.split(" ").map(Number);
      if (vb.length === 4) {
        viewBox = [...vb];
      }
    }
  }
  applyViewBox();
}

async function poll() {
  const res = await fetch("/api/state");
  const st = await res.json();
  const dropZone = document.getElementById("drop-zone");
  if (st.loaded) {
    boardEl.hidden = false;
    bottomPanel.hidden = false;
    if (dropZone) dropZone.hidden = true;
    nameEl.textContent = `${st.name} — v${st.version}`;
    schChip.hidden = st.has_sch;
    document.getElementById("download-btn").hidden = false;
    document.getElementById("reset-btn").hidden = false;
    if (st.version !== lastVersion) {
      lastVersion = st.version;
      await fetchAndInjectSVG(st.version);
      await loadSelectionState();
    }
  } else {
    bottomPanel.hidden = true;
    if (dropZone) dropZone.hidden = false;
    document.getElementById("download-btn").hidden = true;
    document.getElementById("reset-btn").hidden = true;
    document.getElementById("undo-btn").disabled = true;
    lastVersion = 0;
    viewport.querySelectorAll("svg").forEach(el => el.remove());
    viewBox = null;
  }
}

async function refreshForces() {
  if (!lastVersion) return;
  const btn = document.getElementById("refresh-forces-btn");
  const originalText = btn.textContent;
  btn.textContent = "⟳";
  btn.disabled = true;
  try {
    const res = await fetch("/api/placement/forces", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(readParams())
    });
    if (!res.ok) throw new Error(await res.text());
    diagEl.textContent = "forces refreshed";
  } catch (err) {
    console.error("Failed to fetch forces:", err);
    forcesToggle.checked = false;
    diagEl.textContent = `forces failed: ${err.message}`;
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
  fetchAndInjectSVG(lastVersion);
  loadSelectionState();
}

// Zoom / Pan handlers
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  if (!viewBox) return;
  const svg = viewport.querySelector("svg");
  if (!svg) return;
  // Mouse position in SVG user coordinates (before zoom), exact under any aspect ratio
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
  // Zoom factor
  const factor = e.deltaY > 0 ? 1.2 : 0.8333;
  // Keep mouse point fixed: anchor the new viewBox around p
  viewBox[0] = p.x - (p.x - viewBox[0]) * factor;
  viewBox[1] = p.y - (p.y - viewBox[1]) * factor;
  viewBox[2] *= factor;
  viewBox[3] *= factor;
  applyViewBox();
}, { passive: false });

let isMarqueeSelecting = false;
let marqueeStart = null;
let marqueeEl = null;

viewport.addEventListener("mousedown", e => {
  if (e.button !== 0) return; // left click only
  
  // Check if clicking on empty space (for marquee) or on a footprint
  const fpEl = e.target.closest(".footprint");
  const isEmptySpace = !fpEl;
  
  // Start marquee selection on Shift+drag on empty space, or just drag on empty space
  if (isEmptySpace && (e.shiftKey || !fpEl)) {
    isMarqueeSelecting = true;
    const startRect = viewport.getBoundingClientRect();
    marqueeStart = { x: e.clientX - startRect.left, y: e.clientY - startRect.top };
    marqueeEl = document.createElement("div");
    marqueeEl.className = "marquee";
    viewport.appendChild(marqueeEl);
    viewport.classList.add("selecting");
    e.preventDefault();
    return;
  }
  
  // Otherwise start panning
  isPanning = true;
  panStart = { x: e.clientX, y: e.clientY, vb: [...viewBox] };
  viewport.classList.add("panning");
});

window.addEventListener("mousemove", e => {
  if (isMarqueeSelecting && marqueeEl && marqueeStart) {
    const moveRect = viewport.getBoundingClientRect();
    const mx = e.clientX - moveRect.left;
    const my = e.clientY - moveRect.top;
    const left = Math.min(marqueeStart.x, mx);
    const top = Math.min(marqueeStart.y, my);
    const width = Math.abs(mx - marqueeStart.x);
    const height = Math.abs(my - marqueeStart.y);
    marqueeEl.style.left = left + "px";
    marqueeEl.style.top = top + "px";
    marqueeEl.style.width = width + "px";
    marqueeEl.style.height = height + "px";
    return;
  }
  
  if (!isPanning || !viewBox) return;
  // Uniform rendered scale under preserveAspectRatio="xMidYMid meet" (px per user unit)
  const scale = Math.min(viewport.clientWidth / viewBox[2], viewport.clientHeight / viewBox[3]);
  const dx = (e.clientX - panStart.x) / scale;
  const dy = (e.clientY - panStart.y) / scale;
  viewBox[0] = panStart.vb[0] - dx;
  viewBox[1] = panStart.vb[1] - dy;
  applyViewBox();
});

window.addEventListener("mouseup", e => {
  if (isMarqueeSelecting) {
    // Process marquee selection
    if (marqueeEl) {
      const rect = marqueeEl.getBoundingClientRect();

      // Convert marquee bounds to SVG user coordinates via the browser's exact CTM
      const svg = viewport.querySelector("svg");
      if (svg && viewBox) {
        const inv = svg.getScreenCTM().inverse();
        const p1 = new DOMPoint(rect.left, rect.top).matrixTransform(inv);
        const p2 = new DOMPoint(rect.right, rect.bottom).matrixTransform(inv);

        const minX = Math.min(p1.x, p2.x);
        const maxX = Math.max(p1.x, p2.x);
        const minY = Math.min(p1.y, p2.y);
        const maxY = Math.max(p1.y, p2.y);
        
        // Find footprints whose centroids are within the marquee
        svg.querySelectorAll(".footprint").forEach(fpEl => {
          const uuid = fpEl.dataset.fpUuid;
          if (!uuid) return;
          
          // Get footprint centroid from the group transform or compute from courtyard
          const fp = allFootprints.find(f => f.uuid === uuid);
          if (fp) {
            const cx = fp.x_mm;
            const cy = fp.y_mm;
            if (cx >= minX && cx <= maxX && cy >= minY && cy <= maxY) {
              if (!fp.locked && !fp.pinned) {
                if (e.shiftKey) {
                  selectedUuids.add(uuid);
                } else {
                  selectedUuids.add(uuid);
                }
              }
            }
          }
        });
        
        // Update server
        selectedUuids.forEach(uuid => {
          fetch("/api/placement/select", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uuid })
          });
        });
        
        updateFootprintVisuals();
        updateSelectionUI();
        renderFootprintTable();
      }
    }
    
    marqueeEl.remove();
    marqueeEl = null;
    marqueeStart = null;
    isMarqueeSelecting = false;
    viewport.classList.remove("selecting");
    return;
  }
  
  if (isPanning) {
    isPanning = false;
    viewport.classList.remove("panning");
  }
});

// --- Selection state ---
let selectedUuids = new Set();
let pinnedUuids = new Set();

function updateSelectionUI() {
  const selToolbar = document.getElementById("sel-toolbar");
  const selCount = document.getElementById("sel-count");
  const pinBtn = document.getElementById("pin-btn");
  
  if (selectedUuids.size > 0 || pinnedUuids.size > 0) {
    selToolbar.hidden = false;
  } else {
    selToolbar.hidden = true;
  }
  selCount.textContent = `${selectedUuids.size} selected, ${pinnedUuids.size} pinned`;
  pinBtn.textContent = selectedUuids.size > 0 ? "Pin" : "Unpin";
  pinBtn.disabled = selectedUuids.size === 0;
}

async function fetchPinned() {
  try {
    const res = await fetch("/api/placement/pinned");
    const data = await res.json();
    pinnedUuids = new Set(data.pinned || []);
    updateSelectionUI();
  } catch (err) {
    console.error("Failed to fetch pinned:", err);
  }
}

async function fetchSelected() {
  try {
    const res = await fetch("/api/placement/selected");
    const data = await res.json();
    selectedUuids = new Set(data.selected || []);
    updateSelectionUI();
  } catch (err) {
    console.error("Failed to fetch selected:", err);
  }
}

function updateFootprintVisuals() {
  const svg = viewport.querySelector("svg");
  if (!svg) return;
  svg.querySelectorAll(".footprint").forEach(el => {
    const uuid = el.dataset.fpUuid;
    if (!uuid) return;
    el.classList.toggle("fp-selected", selectedUuids.has(uuid));
    el.classList.toggle("fp-pinned", pinnedUuids.has(uuid));
  });
}

async function togglePin(uuid) {
  try {
    const res = await fetch("/api/placement/pin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uuid })
    });
    const data = await res.json();
    pinnedUuids = new Set(data.pinned || []);
    // If pinned, remove from selected
    selectedUuids.delete(uuid);
    updateFootprintVisuals();
    updateSelectionUI();
  } catch (err) {
    console.error("Pin failed:", err);
  }
}

async function toggleSelect(uuid) {
  if (pinnedUuids.has(uuid)) return; // Can't select pinned
  if (selectedUuids.has(uuid)) {
    selectedUuids.delete(uuid);
  } else {
    selectedUuids.add(uuid);
  }
  try {
    await fetch("/api/placement/select", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uuid })
    });
    updateFootprintVisuals();
    updateSelectionUI();
  } catch (err) {
    console.error("Select failed:", err);
  }
}

async function selectAllUnlocked() {
  try {
    const res = await fetch("/api/placement/select_all", { method: "POST" });
    const data = await res.json();
    selectedUuids = new Set(data.selected || []);
    updateFootprintVisuals();
    updateSelectionUI();
  } catch (err) {
    console.error("Select all failed:", err);
  }
}

async function clearSelection() {
  selectedUuids.clear();
  try {
    await fetch("/api/placement/clear_selection", { method: "POST" });
    updateFootprintVisuals();
    updateSelectionUI();
  } catch (err) {
    console.error("Clear selection failed:", err);
  }
}

// Click handler on SVG for footprint selection
viewport.addEventListener("click", e => {
  if (isPanning) return; // Don't select while panning
  const fpEl = e.target.closest(".footprint");
  if (!fpEl) return;
  const uuid = fpEl.dataset.fpUuid;
  if (!uuid) return;
  
  if (e.shiftKey) {
    toggleSelect(uuid);

    if (!pinnedUuids.has(uuid)) {
      selectedUuids.clear();
      selectedUuids.add(uuid);
      updateFootprintVisuals();
      updateSelectionUI();
    }
  }
});

function getFilterValues() {
  return {
    search: document.getElementById("fp-search").value.toLowerCase(),
    ref: document.getElementById("filter-ref").value.toLowerCase(),
    net: document.getElementById("filter-net").value.toLowerCase(),
    layer: document.getElementById("filter-layer").value,
    state: document.getElementById("filter-state").value,
    hideLocked: document.getElementById("filter-hide-locked").checked,
    hideFixed: document.getElementById("filter-hide-fixed").checked,
  };
}

function matchesFilter(fp, filters) {
  if (filters.hideLocked && fp.locked) return false;
  if (filters.hideFixed && (fp.locked || fp.pinned)) return false;
  if (filters.layer && fp.layer !== filters.layer) return false;
  if (filters.state) {
    if (filters.state === "movable" && (fp.locked || fp.pinned)) return false;
    if (filters.state === "locked" && !fp.locked) return false;
    if (filters.state === "pinned" && !fp.pinned) return false;
    if (filters.state === "selected" && !fp.selected) return false;
    if (filters.state === "ghost" && !fp.ghost) return false;
  }
  if (filters.ref) {
    const pattern = filters.ref.replace(/\*/g, ".*");
    const re = new RegExp(`^${pattern}$`, "i");
    if (!re.test(fp.ref)) return false;
  }
  if (filters.net) {
    const pattern = filters.net.replace(/\*/g, ".*");
    const re = new RegExp(`^${pattern}$`, "i");
    if (!fp.nets.some(n => re.test(n))) return false;
  }
  if (filters.search) {
    const s = filters.search;
    const inRef = fp.ref.toLowerCase().includes(s);
    const inFootprint = fp.footprint_id.toLowerCase().includes(s);
    const inNets = fp.nets.some(n => n.toLowerCase().includes(s));
    if (!inRef && !inFootprint && !inNets) return false;
  }
  return true;
}

function getFilteredFootprints() {
  const filters = getFilterValues();
  return allFootprints.filter(fp => matchesFilter(fp, filters));
}

function getStateBadge(fp) {
  if (fp.ghost) return '<span class="state-badge state-ghost">Ghost</span>';
  if (fp.locked) return '<span class="state-badge state-locked">Locked</span>';
  if (fp.pinned) return '<span class="state-badge state-pinned">Pinned</span>';
  if (fp.selected) return '<span class="state-badge state-selected">Selected</span>';
  return '<span class="state-badge state-movable">Movable</span>';
}

function renderFootprintTable() {
  const tbody = document.getElementById("fp-tbody");
  const filtered = getFilteredFootprints();
  tbody.innerHTML = filtered.map(fp => {
    const netsStr = fp.nets.slice(0, 3).join(", ") + (fp.nets.length > 3 ? ` +${fp.nets.length - 3}` : "");
    const layerClass = fp.layer === "B" ? "B" : "F";
    return `
      <tr class="${fp.selected ? 'fp-selected-row' : ''} ${fp.locked ? 'fp-locked-row' : ''} ${fp.pinned ? 'fp-pinned-row' : ''} ${fp.ghost ? 'fp-ghost-row' : ''}" data-uuid="${fp.uuid}">
        <td class="fp-col-select"><input type="checkbox" ${fp.selected ? 'checked' : ''} ${fp.locked || fp.pinned || fp.ghost ? 'disabled' : ''} data-uuid="${fp.uuid}"></td>
        <td class="fp-col-ref" title="${fp.ref}">${fp.ref}</td>
        <td class="fp-col-footprint" title="${fp.footprint_id}">${fp.footprint_id}</td>
        <td class="fp-col-layer"><span class="fp-col-layer ${layerClass}">${fp.layer}</span></td>
        <td class="fp-col-nets" title="${fp.nets.join(", ")}">${netsStr}</td>
        <td class="fp-col-state">${getStateBadge(fp)}</td>
      </tr>
    `;
  }).join("");
  
  // Add click handlers for checkboxes
  tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", e => {
      const uuid = e.target.dataset.uuid;
      if (e.target.checked) {
        selectedUuids.add(uuid);
      } else {
        selectedUuids.delete(uuid);
      }
      // Update server
      fetch("/api/placement/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uuid })
      });
      updateFootprintVisuals();
      updateSelectionUI();
      renderFootprintTable(); // Re-render to update row highlighting
    });
  });
  
  // Add click handlers for rows (click row to select)
  tbody.querySelectorAll("tr").forEach(tr => {
    tr.addEventListener("click", e => {
      if (e.target.type === "checkbox") return; // Handled by checkbox
      const uuid = tr.dataset.uuid;
      if (!uuid) return;
      const fp = allFootprints.find(f => f.uuid === uuid);
      if (!fp || fp.locked || fp.pinned) return;
      
      if (e.shiftKey) {
        // Range select not implemented yet - just toggle
        toggleSelect(uuid).then(() => renderFootprintTable());
      } else if (e.ctrlKey || e.metaKey) {
        toggleSelect(uuid).then(() => renderFootprintTable());
      } else {
        selectedUuids.clear();
        selectedUuids.add(uuid);
        fetch("/api/placement/select", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uuid })
        });
        updateFootprintVisuals();
        updateSelectionUI();
        renderFootprintTable();
      }
    });
  });
  
  // Update select all checkbox
  const selectAllCb = document.getElementById("fp-select-all");
  if (selectAllCb) {
    selectAllCb.checked = filtered.length > 0 && filtered.every(fp => fp.selected);
    selectAllCb.indeterminate = filtered.some(fp => fp.selected) && !filtered.every(fp => fp.selected);
  }
  
  // Update net legend
  renderNetLegend();
}

function renderNetLegend() {
  const legendItems = document.getElementById("net-legend-items");
  const legendBar = document.getElementById("net-legend");
  const legendHeader = document.getElementById("net-legend-header");
  if (!legendItems || !legendBar || !legendHeader) return;
  
  // Aggregate nets from all footprints
  const netCounts = {};
  allFootprints.forEach(fp => {
    fp.nets.forEach(net => {
      if (net) netCounts[net] = (netCounts[net] || 0) + 1;
    });
  });
  
  // Sort by count descending, then alphabetically
  const sortedNets = Object.entries(netCounts)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, 20); // Limit to top 20 nets
  
  // Generate deterministic colors (same as svg_render.py)
  function netColor(net, idx) {
    const hue = (idx * 137.508) % 360;
    return `hsl(${hue}, 75%, 62%)`;
  }
  
  if (sortedNets.length > 0) {
    legendBar.hidden = false;
    legendHeader.hidden = false;
    legendItems.innerHTML = sortedNets.map(([net, count], idx) => {
      const color = netColor(net, idx);
      return `
        <div class="net-legend-item" data-net="${net}" title="${net}: ${count} parts" style="--net-color: ${color};">
          <span class="net-legend-swatch" style="background: ${color};"></span>
          <span class="net-legend-name">${net}</span>
          <span class="net-legend-count">${count}</span>
        </div>
      `;
    }).join("");
    
    // Add click handlers for net selection
    legendItems.querySelectorAll(".net-legend-item").forEach(item => {
      item.addEventListener("click", () => {
        const net = item.dataset.net;
        selectByNet(net);
      });
    });
  } else {
    legendBar.hidden = true;
    legendHeader.hidden = true;
  }
}

async function selectByNet(net) {
  // Find all footprints that have this net
  const uuidsToSelect = allFootprints
    .filter(fp => fp.nets.includes(net) && !fp.locked && !fp.pinned)
    .map(fp => fp.uuid);
  
  if (uuidsToSelect.length === 0) return;
  
  // Clear current selection and select these
  selectedUuids.clear();
  uuidsToSelect.forEach(uuid => selectedUuids.add(uuid));
  
  // Update server for each
  for (const uuid of uuidsToSelect) {
    await fetch("/api/placement/select", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uuid })
    });
  }
  
  updateFootprintVisuals();
  updateSelectionUI();
  renderFootprintTable();
}

// Common function to run placement
async function runPlacement(movableUuids, iterations, isPreview = false) {
  try {
    const saveRes = await fetch("/api/placement/params", { method: "POST", body: JSON.stringify(readParams()) });
    if (!saveRes.ok) throw new Error(await saveRes.text());
    
    const res = await fetch("/api/placement/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        iterations: isPreview ? 1 : iterations,  // Preview uses 1 physics iteration
        movable_uuids: movableUuids,
        stub: false  // Always use physics mode; preview just runs fewer iterations
      })
    });
    if (!res.ok) throw new Error(await res.text());
    const r = await res.json();
    diagEl.textContent = `v${r.version} — ${r.moved} moved, max Δ ${r.final_max_disp_mm.toFixed(2)} mm, ${r.elapsed_s.toPrecision(2)} s`;
    document.getElementById("accept-btn").disabled = false;
    if (!isPreview) {
      document.getElementById("step-selected-btn").textContent = "Step Selected Again";
      document.getElementById("step-all-btn").textContent = "Step All Again";
    }
  } catch (err) {
    diagEl.textContent = `run failed: ${err.message}`;
  }
}

// ==================== Routing Panel Logic ====================

let selectedNets = new Set();  // Set of net names selected for routing
let routingParams = {};  // Current routing parameters

// Net color function (shared with net legend)
function netColor(net, idx) {
  const hue = (idx * 137.508) % 360;
  return `hsl(${hue}, 75%, 62%)`;
}

// Fetch all nets from server and render net table
async function fetchNets() {
  if (!lastVersion) return;
  try {
    const res = await fetch("/api/nets");
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    renderNetsTable(data.nets || []);
  } catch (err) {
    console.error("Failed to fetch nets:", err);
  }
}

// Render nets table
function renderNetsTable(nets) {
  const tbody = document.getElementById("nets-tbody");
  if (!tbody) return;
  
  tbody.innerHTML = nets.map((net, idx) => {
    const color = netColor(net.name, idx);
    return `
      <tr class="${selectedNets.has(net.name) ? 'net-selected-row' : ''}" data-net="${net.name}" style="--net-color: ${color};">
        <td class="net-col-select"><input type="checkbox" class="net-col-select" ${selectedNets.has(net.name) ? 'checked' : ''} data-net="${net.name}"></td>
        <td class="net-col-name">
          <span class="net-swatch" style="background: ${color};"></span>
          ${net.name}
        </td>
        <td class="net-col-pads">${net.pad_count}</td>
        <td class="net-col-fps">${net.footprint_count}</td>
        <td class="net-col-tracks">${net.track_count}</td>
        <td class="net-col-vias">${net.via_count}</td>
        <td class="net-col-protect">
          <label class="chk"><input type="checkbox" class="net-protect-cb" ${net.protected ? 'checked' : ''} data-net="${net.name}" title="Protected nets are routed first and never ripped up"></label>
        </td>
      </tr>
    `;
  }).join("");
  
  // Add click handlers for checkboxes
  tbody.querySelectorAll('input.net-col-select[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", e => {
      const net = e.target.dataset.net;
      if (e.target.checked) {
        selectedNets.add(net);
      } else {
        selectedNets.delete(net);
      }
      updateNetSelectionUI();
    });
  });
  
  // Add click handlers for protected checkboxes
  tbody.querySelectorAll('input.net-protect-cb[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", async e => {
      const net = e.target.dataset.net;
      const protectedFlag = e.target.checked;
      try {
        const res = await fetch("/api/nets/protected", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ net, protected: protectedFlag })
        });
        if (!res.ok) throw new Error(await res.text());
        // Re-fetch to update table
        await fetchNets();
      } catch (err) {
        console.error("Failed to toggle protected:", err);
        // Revert checkbox on error
        await fetchNets();
      }
    });
  });
  
  // Row click to select/deselect
  tbody.querySelectorAll("tr").forEach(tr => {
    tr.addEventListener("click", e => {
      if (e.target.type === "checkbox") return;
      const net = tr.dataset.net;
      if (!net) return;
      
      if (e.shiftKey || e.ctrlKey || e.metaKey) {
        toggleNetSelection(net).then(() => renderNetsTable(Array.from(selectedNets).map(n => ({name: n}))));
      } else {
        selectedNets.clear();
        selectedNets.add(net);
        renderNetsTable(Array.from(selectedNets).map(n => ({name: n})));
      }
    });
  });
  
  // Update "select all" checkbox
  const selectAllCb = document.getElementById("nets-select-all");
  if (selectAllCb) {
    selectAllCb.checked = nets.length > 0 && nets.every(n => selectedNets.has(n.name));
    selectAllCb.indeterminate = nets.some(n => selectedNets.has(n.name)) && !nets.every(n => selectedNets.has(n.name));
  }
}

async function toggleNetSelection(net) {
  if (selectedNets.has(net)) {
    selectedNets.delete(net);
  } else {
    selectedNets.add(net);
  }
}

function updateNetSelectionUI() {
  const count = selectedNets.size;
  const routeBtn = document.getElementById("route-selected-btn");
  if (routeBtn) {
    routeBtn.disabled = count === 0;
    routeBtn.textContent = count > 0 ? `Route ${count} Selected Net${count > 1 ? 's' : ''}` : "Route Selected Nets";
  }
}

// Load routing params from server
async function loadRoutingParams() {
  try {
    const res = await fetch("/api/routing/params");
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    routingParams = data.params || {};
    renderRoutingParams(routingParams);
  } catch (err) {
    console.error("Failed to load routing params:", err);
    renderRoutingParams({});
  }
}

// Render routing params sliders
function renderRoutingParams(params) {
  const grid = document.getElementById("routing-params-grid");
  if (!grid) return;
  
  const ROUTING_PARAM_DEFS = [
    { key: "track_width_mm", label: "Track Width (mm)", min: 0.1, max: 2.0, step: 0.05, default: 0.25 },
    { key: "power_width_mm", label: "Power Width (mm)", min: 0.2, max: 3.0, step: 0.05, default: 0.5 },
    { key: "clearance_mm", label: "Clearance (mm)", min: 0.1, max: 1.0, step: 0.05, default: 0.2 },
    { key: "via_cost_mm", label: "Via Cost (mm)", min: 1, max: 20, step: 0.5, default: 5 },
    { key: "max_via_count", label: "Max Vias", min: 10, max: 50, step: 10, default: 50 },
    { key: "grid_resolution_mm", label: "Grid Resolution (mm)", min: 0.05, max: 0.5, step: 0.05, default: 0.1 },
  ];
  
  // Debug checkbox
  const debugChecked = params.debug ? "checked" : "";
  const debugHtml = `
    <div class="param">
      <span title="Enable debug output (cost grid, search frontier)">Debug Mode</span>
      <div class="row">
        <label class="chk" style="margin:0;">
          <input type="checkbox" data-key="debug" ${debugChecked}> Enabled
        </label>
      </div>
    </div>
  `;
  
  grid.innerHTML = ROUTING_PARAM_DEFS.map(def => {
    const value = params[def.key] ?? def.default;
    return `
      <div class="param">
        <span title="${def.label}">${def.label}</span>
        <div class="row">
          <input type="range" data-key="${def.key}" min="${def.min}" max="${def.max}" step="${def.step}" value="${value}">
          <input type="number" data-key="${def.key}" min="${def.min}" max="${def.max}" step="${def.step}" value="${value}">
        </div>
      </div>
    `;
  }).join("") + debugHtml;
  
  // Sync range and number inputs
  grid.querySelectorAll('input[type="range"]').forEach(range => {
    range.addEventListener("input", e => {
      const key = e.target.dataset.key;
      const num = grid.querySelector(`input[type="number"][data-key="${key}"]`);
      if (num) num.value = range.value;
    });
  });
  grid.querySelectorAll('input[type="number"]').forEach(num => {
    num.addEventListener("input", e => {
      const key = e.target.dataset.key;
      const range = grid.querySelector(`input[type="range"][data-key="${key}"]`);
      if (range) range.value = num.value;
    });
  });
}

// Read routing params from UI
function readRoutingParams() {
  const grid = document.getElementById("routing-params-grid");
  if (!grid) return {};
  const params = {};
  grid.querySelectorAll('input[data-key]').forEach(input => {
    if (input.type === "checkbox") {
      params[input.dataset.key] = input.checked;
    } else {
      params[input.dataset.key] = input.type === "number" ? Number(input.value) : input.value;
    }
  });
  return params;
}

// Save routing params to server
async function saveRoutingParams() {
  const params = readRoutingParams();
  try {
    const res = await fetch("/api/routing/params", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(params)
    });
    if (!res.ok) throw new Error(await res.text());
    routingParams = params;
  } catch (err) {
    console.error("Failed to save routing params:", err);
  }
}

// Route selected nets
async function routeSelectedNets() {
  if (selectedNets.size === 0) return;
  const diag = document.getElementById("route-diag");
  const routeBtn = document.getElementById("route-selected-btn");
  const routeAllBtn = document.getElementById("route-all-btn");
  
  routeBtn.disabled = true;
  routeAllBtn.disabled = true;
  routeBtn.classList.add("loading");
  routeAllBtn.classList.add("loading");
  diag.textContent = "Routing...";
  
  try {
    const params = readRoutingParams();
    const res = await fetch("/api/routing/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        net_names: Array.from(selectedNets),
        params
      })
    });
    if (!res.ok) throw new Error(await res.text());
    const r = await res.json();
    diag.textContent = `v${r.version} — ${r.tracks_added} tracks, ${r.vias_added} vias, ${r.nets_routed} routed, ${r.nets_failed} failed`;
    if (r.pcb_tree) {
      // Refresh SVG to show new routes
      await fetchAndInjectSVG(r.version);
    }
    // Handle debug response
    if (r.debug) {
      showCostGridDebug(r.debug);
    }
    // Re-fetch nets to update track/via counts
    await fetchNets();
  } catch (err) {
    diag.textContent = `routing failed: ${err.message}`;
  } finally {
    routeBtn.disabled = false;
    routeAllBtn.disabled = false;
    routeBtn.classList.remove("loading");
    routeAllBtn.classList.remove("loading");
    updateNetSelectionUI();
  }
}

// Route all unprotected nets
async function routeAllNets() {
  const diag = document.getElementById("route-diag");
  const routeBtn = document.getElementById("route-selected-btn");
  const routeAllBtn = document.getElementById("route-all-btn");
  
  routeBtn.disabled = true;
  routeAllBtn.disabled = true;
  routeBtn.classList.add("loading");
  routeAllBtn.classList.add("loading");
  diag.textContent = "Routing...";
  
  try {
    const res = await fetch("/api/nets");
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const unprotected = (data.nets || []).filter(n => !n.protected).map(n => n.name);
    if (unprotected.length === 0) return;
    
    // Temporarily select all unprotected
    const originalSelected = new Set(selectedNets);
    selectedNets = new Set(unprotected);
    renderNetsTable(Array.from(selectedNets).map(n => ({name: n})));
    await routeSelectedNets();
  } catch (err) {
    diag.textContent = `routing failed: ${err.message}`;
  } finally {
    routeBtn.disabled = false;
    routeAllBtn.disabled = false;
    routeBtn.classList.remove("loading");
    routeAllBtn.classList.remove("loading");
  }
}

// Event listeners for routing panel
document.getElementById("route-selected-btn").addEventListener("click", routeSelectedNets);
document.getElementById("route-all-btn").addEventListener("click", routeAllNets);

// Select all checkbox in nets table
document.getElementById("nets-select-all").addEventListener("change", e => {
  const rows = document.querySelectorAll("#nets-tbody tr");
  if (e.target.checked) {
    rows.forEach(tr => {
      const net = tr.dataset.net;
      if (net) selectedNets.add(net);
    });
  } else {
    selectedNets.clear();
  }
  renderNetsTable(Array.from(selectedNets).map(n => ({name: n})));
});

// Protect all checkbox
document.getElementById("nets-protect-all").addEventListener("change", async e => {
  const rows = document.querySelectorAll("#nets-tbody tr");
  for (const tr of rows) {
    const net = tr.dataset.net;
    const cb = tr.querySelector(".net-protect-cb");
    if (cb && cb.checked !== e.target.checked) {
      cb.checked = e.target.checked;
      try {
        await fetch("/api/nets/protected", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ net, protected: e.target.checked })
        });
      } catch (err) {
        console.error("Failed to toggle protect all:", err);
      }
    }
  }
  await fetchNets();
});

const routingPanel = document.getElementById("routing-panel");
const placementPanel = document.getElementById("placement-panel");

// Tab switching for Place/Route panels
document.getElementById("place-tab-btn").addEventListener("click", () => {
  placementPanel.hidden = false;
  routingPanel.hidden = true;

// Resizable sidebar splitter
const sidebar = document.getElementById("sidebar");
const resizer = document.getElementById("resizer");
const mainContent = document.querySelector(".main-content");

let startX, startWidth;

function getSidebarWidth() {
  const computed = getComputedStyle(sidebar).width;
  const px = parseInt(computed, 10);
  return isNaN(px) || px === 0 ? sidebar.offsetWidth : px;
}

function initResizer() {
  // Restore from localStorage
  const savedWidth = localStorage.getItem("sidebar-width");
  if (savedWidth) {
    sidebar.style.width = savedWidth + "px";
  }

  resizer.addEventListener("mousedown", e => {
    e.preventDefault();
    startX = e.clientX;
    startWidth = getSidebarWidth();
    resizer.classList.add("dragging");
    document.addEventListener("mousemove", doDrag);
    document.addEventListener("mouseup", stopDrag);
  });
}

function doDrag(e) {
  const width = startWidth + (e.clientX - startX);
  const clamped = Math.max(320, Math.min(500, width));
  sidebar.style.width = clamped + "px";
}

function stopDrag() {
  resizer.classList.remove("dragging");
  document.removeEventListener("mousemove", doDrag);
  document.removeEventListener("mouseup", stopDrag);
  localStorage.setItem("sidebar-width", sidebar.style.width);
}

// Initialize after DOM is ready (handles timing issues)
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initResizer);
} else {
  initResizer();
}

// Bottom panel vertical resizer
const panelResizer = document.getElementById("panel-resizer");
let panelStartY, panelStartHeight;

function initPanelResizer() {
  // Restore from localStorage
  const savedHeight = localStorage.getItem("bottom-panel-height");
  if (savedHeight) {
    bottomPanel.style.height = savedHeight + "px";
  }

  panelResizer.addEventListener("mousedown", e => {
    e.preventDefault();
    panelStartY = e.clientY;
    // bottomPanel height is in px, get computed value
    const computed = getComputedStyle(bottomPanel).height;
    panelStartHeight = parseInt(computed, 10);
    panelResizer.classList.add("dragging");
    document.addEventListener("mousemove", doPanelDrag);
    document.addEventListener("mouseup", stopPanelDrag);
  });
}

function doPanelDrag(e) {
  // Drag up = increase panel height (negative deltaY since Y increases downward)
  const height = panelStartHeight - (e.clientY - panelStartY);
  const clamped = Math.max(32, Math.min(window.innerHeight * 0.7, height));
  bottomPanel.style.height = clamped + "px";
}

function stopPanelDrag() {
  panelResizer.classList.remove("dragging");
  document.removeEventListener("mousemove", doPanelDrag);
  document.removeEventListener("mouseup", stopPanelDrag);
  localStorage.setItem("bottom-panel-height", bottomPanel.style.height);
}

// Initialize panel resizer
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initPanelResizer);
} else {
  initPanelResizer();
}

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  // Don't trigger shortcuts when typing in inputs
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
  
  if (e.key === "Escape") {
    clearSelection();
  } else if (e.key === "a" || e.key === "A") {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      selectAllUnlocked();
    }
  } else if (e.key === "p" || e.key === "P") {
    // Pin selected
    if (selectedUuids.size > 0) {
      selectedUuids.forEach(uuid => togglePin(uuid));
    }
  } else if (e.key === "u" || e.key === "U") {
    // Unpin selected
    const toUnpin = Array.from(selectedUuids).filter(u => pinnedUuids.has(u));
    toUnpin.forEach(uuid => togglePin(uuid));
  } else if (e.key === " ") {
    // Space - step selected
    e.preventDefault();
    document.getElementById("step-selected-btn").click();
  }
});

poll();
setInterval(poll, 2000);
