project:
  type: book
  title: "KiCad AutoRouter — Physics Primer & Test Reference"

book:
  chapters:
    - index.qmd
    - physics_primer.qmd
    - pytest_results.qmd
  # Served inside our own docs viewer: no sidebar search needed.
  # (Saves ~160KB of autocomplete/fuse JS per page.)
  search: false

format:
  html:
    # No Bootswatch theme: cosmo pulls in ~1.5MB of Source Sans Pro
    # plus bootstrap JS/icons. System fonts are fine for a reference doc.
    theme: none
    toc: true
    number-sections: true
    code-fold: false
    code-tools: false
    toc-depth: 3
    # Lean figures: 8x4in @ 96dpi, no retina doubling (~750px wide,
    # plenty for line charts at ~900px column width).
    fig-width: 8
    fig-height: 4
    fig-dpi: 96
    fig-retina: 1
    # Formulas fall back to raw TeX spans; the viewer has no other
    # typesetter, so keep the CDN loader (a few lines, loaded on demand).
    html-math-method: mathjax
    embed-resources: true
  pdf:
    documentclass: scrbook
    geometry: margin=1in
    fontsize: 11pt
    linestretch: 1.15
    fig-width: 6.5
    fig-height: 4
    fig-dpi: 300

execute:
  engine: python
  warning: false
  message: false
  echo: false
  eval: true
  # auto: re-execute only cells whose source changed (cached in _freeze/,
  # gitignored). Without this every render re-runs the full pytest suite
  # twice (pytest_results.qmd §§4-5) plus the placement sweep (§4 heatmap).
  freeze: auto